<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <rect width="400" height="200" fill="#F8FAFC"/>
  <!-- Paper Header -->
  <text x="200" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1E293B">Environment Generation for Robotic Manipulation via Self-Play</text>
  <text x="200" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Jingyao Hu, Michael Zhang, Daniel Shin, Yuxin Wu</text>
  
  <!-- Sub-panels -->
  <!-- Panel 1: Simulation GUI -->
  <rect x="20" y="48" width="105" height="110" rx="4" fill="#0F172A" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="20" y="48" width="105" height="16" rx="4" fill="#1E293B"/>
  <circle cx="28" cy="56" r="3" fill="#EF4444"/>
  <circle cx="36" cy="56" r="3" fill="#F59E0B"/>
  <circle cx="44" cy="56" r="3" fill="#10B981"/>
  <!-- 3D Environment grid -->
  <path d="M 30 110 L 72 80 L 115 110 L 72 140 Z" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <rect x="62" y="90" width="20" height="25" fill="#3B82F6" rx="2"/>
  <circle cx="72" cy="85" r="5" fill="#F59E0B"/>
  <line x1="72" y1="68" x2="72" y2="85" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Panel 2: Code Editor -->
  <rect x="135" y="48" width="115" height="110" rx="4" fill="#1E1E2E" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="135" y="48" width="115" height="16" rx="4" fill="#2E2E3E"/>
  <text x="142" y="59" font-family="monospace" font-size="8" fill="#F59E0B">def generate_env():</text>
  <line x1="145" y1="72" x2="230" y2="72" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="82" x2="210" y2="82" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="92" x2="238" y2="92" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="102" x2="200" y2="102" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="112" x2="225" y2="112" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="122" x2="190" y2="122" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="132" x2="220" y2="132" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Panel 3: Architecture Diagram -->
  <rect x="260" y="48" width="120" height="110" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="270" y="60" width="45" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="292" y="77" font-family="system-ui" font-size="8" font-weight="600" text-anchor="middle" fill="#1D4ED8">Generator</text>
  
  <path d="M 315 74 L 335 74" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="335" y="60" width="40" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="355" y="77" font-family="system-ui" font-size="8" font-weight="600" text-anchor="middle" fill="#B91C1C">Solver</text>

  <rect x="275" y="105" width="90" height="35" rx="4" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
  <text x="320" y="122" font-family="system-ui" font-size="8" font-weight="600" text-anchor="middle" fill="#047857">Curriculum RL</text>
  <text x="320" y="133" font-family="system-ui" font-size="7" text-anchor="middle" fill="#059669">Verified Self-Play</text>
</svg>
