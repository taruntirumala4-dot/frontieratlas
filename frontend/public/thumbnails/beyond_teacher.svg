<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <rect width="400" height="200" fill="#F8FAFC"/>
  <text x="200" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1E293B">Beyond Teacher Likelihood: Group-Calibrated On-Policy Distillation</text>
  <text x="200" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Zhengyan Zhang, Aohan Zeng, Wenhao Li, Yejin Choi</text>

  <!-- Distillation diagram with blue and cyan boxes -->
  <g transform="translate(30, 55)">
    <!-- Long document input -->
    <rect x="0" y="10" width="55" height="75" rx="3" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="27" y="28" font-family="system-ui" font-size="7" font-weight="600" text-anchor="middle" fill="#1D4ED8">Long</text>
    <text x="27" y="38" font-family="system-ui" font-size="7" font-weight="600" text-anchor="middle" fill="#1D4ED8">Context</text>
    <line x1="8" y1="50" x2="47" y2="50" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="8" y1="58" x2="47" y2="58" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="8" y1="66" x2="35" y2="66" stroke="#93C5FD" stroke-width="1.5"/>

    <path d="M 60 45 L 90 45" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Teacher Model -->
    <rect x="95" y="0" width="80" height="40" rx="4" fill="#F0FDF4" stroke="#22C55E"/>
    <text x="135" y="22" font-family="system-ui" font-size="8" font-weight="bold" text-anchor="middle" fill="#15803D">Teacher LM</text>
    <text x="135" y="33" font-family="system-ui" font-size="6.5" text-anchor="middle" fill="#16A34A">(Full Attention)</text>

    <!-- Student Model -->
    <rect x="95" y="55" width="80" height="40" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="135" y="77" font-family="system-ui" font-size="8" font-weight="bold" text-anchor="middle" fill="#B45309">Student LM</text>
    <text x="135" y="88" font-family="system-ui" font-size="6.5" text-anchor="middle" fill="#D97706">(Efficient)</text>

    <path d="M 180 20 L 210 20 L 210 38 L 225 38" stroke="#64748B" stroke-width="1.5"/>
    <path d="M 180 75 L 210 75 L 210 55 L 225 55" stroke="#64748B" stroke-width="1.5"/>

    <!-- Group-Calibrated Loss -->
    <rect x="230" y="20" width="105" height="55" rx="5" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="282" y="42" font-family="system-ui" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#4338CA">Group-Calibrated</text>
    <text x="282" y="54" font-family="system-ui" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#4338CA">On-Policy Loss</text>
    <text x="282" y="65" font-family="monospace" font-size="6" text-anchor="middle" fill="#6366F1">L = D_KL(P_T || P_S)</text>
  </g>
</svg>
