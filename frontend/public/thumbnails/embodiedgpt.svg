<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <rect width="400" height="200" fill="#F8FAFC"/>
  <text x="200" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1E293B">EmbodiedGPT: Vision-Language Models for Embodied Decision-Making</text>
  <text x="200" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Siyuan Huang, Wenlong Wang, Chenfei Wu</text>

  <!-- Left: RGB camera input -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="75" height="65" rx="4" fill="#0F172A"/>
    <text x="37" y="14" font-family="system-ui" font-size="6" fill="#94A3B8" text-anchor="middle">RGB Observation</text>
    <circle cx="37" cy="38" r="14" fill="#3B82F6"/>
    <circle cx="37" cy="38" r="6" fill="#0F172A"/>
    <circle cx="40" cy="35" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Middle: Embodied-GPT Engine -->
  <g transform="translate(115, 55)">
    <rect x="0" y="0" width="115" height="65" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="57" y="20" font-family="system-ui" font-size="8" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Embodied-GPT</text>
    <rect x="12" y="30" width="91" height="24" rx="3" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="57" y="45" font-family="monospace" font-size="6.5" fill="#2563EB" text-anchor="middle">Chain-of-Embodied</text>
  </g>

  <!-- Right: Robot Body & Tool Affordance -->
  <g transform="translate(245, 55)">
    <rect x="0" y="0" width="130" height="65" rx="4" fill="#FEFCE8" stroke="#FACC15"/>
    <text x="65" y="15" font-family="system-ui" font-size="6.5" font-weight="600" fill="#854D0E" text-anchor="middle">Embodied Action Execution</text>
    <!-- Robot figure -->
    <circle cx="45" cy="38" r="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="42" cy="36" r="2" fill="#0F172A"/>
    <circle cx="48" cy="36" r="2" fill="#0F172A"/>
    <!-- Arm -->
    <line x1="52" y1="42" x2="85" y2="35" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <polygon points="85,30 95,35 85,40" fill="#EA580C"/>
  </g>
</svg>
